<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Vòng Quay</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f4f6;color:#111}.wrap{max-width:950px;margin:auto;padding:25px}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 5px 20px #00000012}input,button{padding:12px;border-radius:9px;border:1px solid #ddd;font-size:15px}input{width:100%;margin:6px 0}button{background:#111827;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 140px;gap:10px}.msg{margin:10px 0;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>⚙️ QUẢN TRỊ VÒNG QUAY</h1><div class="card"><h3>Đăng nhập</h3><input id="pass" type="password" placeholder="Mật khẩu admin"><button onclick="login()">ĐĂNG NHẬP</button><div id="msg" class="msg"></div></div><div id="panel" style="display:none"><div class="card"><h3>Cấp lượt cho người chơi</h3><div class="grid"><input id="code" placeholder="Mã người chơi, ví dụ PHUC01"><input id="turns" type="number" min="1" value="3"></div><br><button onclick="grant()">CẤP LƯỢT</button><div id="grantmsg" class="msg"></div></div><div class="card"><h3>Người chơi</h3><div id="players"></div></div><div class="card"><h3>Lịch sử gần đây</h3><div id="history"></div></div></div></div><script>
let password='';async function api(p,d){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return [r.ok,await r.json()]}
async function login(){let p=pass.value;let [ok,d]=await api('/api/login',{password:p});if(ok){password=p;panel.style.display='block';msg.textContent='Đăng nhập thành công';load()}else msg.textContent='Sai mật khẩu'}
async function grant(){let [ok,d]=await api('/api/grant',{password,code:code.value,turns:turns.value});grantmsg.textContent=ok?'Đã cấp '+d.turns+' lượt cho '+d.code:d.error;load()}
async function load(){let r=await fetch('/api/admin/players?password='+encodeURIComponent(password)),d=await r.json();players.innerHTML='<table><tr><th>Mã</th><th>Lượt còn</th></tr>'+Object.entries(d.players).map(([k,v])=>`<tr><td>${k}</td><td>${v.turns}</td></tr>`).join('')+'</table>';history.innerHTML='<table><tr><th>Mã</th><th>Kết quả</th><th>Thời gian</th></tr>'+d.history.map(h=>`<tr><td>${h.code}</td><td>${h.prize}</td><td>${new Date(h.time).toLocaleString('vi-VN')}</td></tr>`).join('')+'</table>'}
</script></body></html>
