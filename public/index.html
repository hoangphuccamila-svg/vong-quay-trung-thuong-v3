<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vòng Quay</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#111827,#312e81);color:#fff;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:25px}.top{text-align:center}.top h1{font-size:34px}.app{display:grid;grid-template-columns:1fr 320px;gap:25px}.card{background:#ffffff16;border:1px solid #ffffff22;border-radius:22px;padding:20px;backdrop-filter:blur(12px)}.wheel{display:flex;justify-content:center;position:relative}canvas{width:min(70vw,600px);height:min(70vw,600px)}.pointer{position:absolute;top:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:38px solid #ffd43b}.input{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;margin:8px 0 12px}.btn{width:100%;padding:16px;border:0;border-radius:11px;font-size:18px;font-weight:800;cursor:pointer;background:#ffd43b}.btn:disabled{opacity:.5}.status{text-align:center;font-size:18px;font-weight:bold;margin:14px 0}.result{text-align:center;font-size:25px;font-weight:900;min-height:38px}.hint{font-size:13px;opacity:.75;line-height:1.5}@media(max-width:800px){.app{grid-template-columns:1fr}.wheel{order:0}canvas{width:88vw;height:88vw}}</style></head>
<body><div class="wrap"><div class="top"><h1>🎉 VÒNG QUAY TRÚNG THƯỞNG</h1><p>Nhập mã được người tổ chức cấp để bắt đầu.</p></div>
<div class="app"><div class="card wheel"><div class="pointer"></div><canvas id="c" width="700" height="700"></canvas></div><div class="card"><b>MÃ NGƯỜI CHƠI</b><input id="code" class="input" placeholder="Ví dụ: PHUC01"><button id="join" class="btn">KIỂM TRA LƯỢT</button><div id="status" class="status"></div><button id="spin" class="btn" disabled>QUAY NGAY</button><div id="result" class="result"></div><p class="hint">Mỗi lần quay sẽ tự trừ 1 lượt. Bạn cần liên hệ người tổ chức để được cấp thêm lượt.</p></div></div></div>
<script>
const prizes=[
['Bao cơm trưa',0.5],
['Cà phê',0.5],
['10.000 VND',7],
['20.000 VND',5],
['50.000 VND',8],
['100.000 VND',3],
['200.000 VND',1],
['Trúng Gió',75]
];
const colors=['#ef4444','#f59e0b','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6'];let angle=0,busy=false,turns=0;
const c=document.getElementById('c'),x=c.getContext('2d');
function draw(){x.clearRect(0,0,700,700);let n=prizes.length,a=2*Math.PI/n;x.save();x.translate(350,350);x.rotate(angle);prizes.forEach((p,i)=>{let q=i*a;x.beginPath();x.moveTo(0,0);x.arc(0,0,320,q,q+a);x.closePath();x.fillStyle=colors[i];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.save();x.rotate(q+a/2);x.textAlign='right';x.fillStyle='#fff';x.font='bold 21px Arial';x.fillText(p[0],295,7);x.restore()});x.restore();x.beginPath();x.arc(350,350,52,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.fillStyle='#111827';x.font='bold 17px Arial';x.textAlign='center';x.fillText('QUAY',350,356)}
async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return [r.ok,await r.json()]}
join.onclick=async()=>{let code=document.getElementById('code').value.trim().toUpperCase();if(!code)return;let [ok,d]=await post('/api/player',{code});if(ok){turns=d.turns;status.textContent='Bạn còn '+turns+' lượt quay';spin.disabled=turns<=0}else status.textContent=d.error||'Lỗi'};
spin.onclick=async()=>{if(busy||turns<=0)return;let code=document.getElementById('code').value.trim().toUpperCase();let [ok,d]=await post('/api/spin',{code});if(!ok){status.textContent=d.error;return}turns=d.turns;busy=true;spin.disabled=true;result.textContent='';let wi=prizes.findIndex(p=>p[0]===d.prize),a=2*Math.PI/prizes.length,target=-Math.PI/2-(wi*a+a/2),cur=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),delta=((target-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*6,start=angle,t0=performance.now(),dur=5200;
function anim(t){let p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);angle=start+delta*e;draw();if(p<1)requestAnimationFrame(anim);else{busy=false;result.textContent='🏆 '+d.prize;status.textContent='Bạn còn '+turns+' lượt quay';spin.disabled=turns<=0}}requestAnimationFrame(anim)}
draw();
</script></body></html>
