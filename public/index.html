<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vòng Quay</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#111827,#312e81);color:#fff;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:25px}.top{text-align:center}.top h1{font-size:34px}.app{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:25px}.card{background:#ffffff16;border:1px solid #ffffff22;border-radius:22px;padding:20px;backdrop-filter:blur(12px)}.wheel{display:flex;justify-content:center;position:relative}.wheel canvas{width:min(70vw,650px);height:min(70vw,650px)}.pointer{position:absolute;top:0;border-left:18px solid transparent;border-right:18px solid transparent;border-bottom:38px solid #ffd43b;z-index:2}.input{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;margin:8px 0 12px}.btn{width:100%;padding:16px;border:0;border-radius:11px;font-size:18px;font-weight:800;cursor:pointer;background:#ffd43b;color:#111}.btn:disabled{opacity:.5;cursor:not-allowed}.status{text-align:center;font-size:18px;font-weight:bold;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#ffffff14;border:1px solid #ffffff22;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.stat span{font-size:12px;opacity:.8}.result{text-align:center;font-size:25px;font-weight:900;min-height:38px;margin:12px 0}.history{margin-top:18px}.history h3{margin:0 0 10px}.history-list{max-height:250px;overflow:auto;border-radius:12px;background:#00000018}.history-item{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid #ffffff18;font-size:14px}.history-item:last-child{border-bottom:0}.history-empty{text-align:center;opacity:.7;padding:18px;font-size:14px}.prize{font-weight:800}.hint{font-size:13px;opacity:.75;line-height:1.5}@media(max-width:850px){.app{grid-template-columns:1fr}.wheel{order:0}.wheel canvas{width:88vw;height:88vw}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:430px){.wrap{padding:12px}.top h1{font-size:25px}.stats .stat{padding:9px 4px}.stat b{font-size:21px}.history-item{font-size:13px}}</style></head>
<body><div class="wrap"><div class="top"><h1>🎉 VÒNG QUAY TRÚNG THƯỞNG</h1><p>Nhập mã được người tổ chức cấp để bắt đầu.</p></div>
<div class="app"><div class="card wheel"><div class="pointer"></div><canvas id="c" width="700" height="700"></canvas></div><div class="card"><b>MÃ NGƯỜI CHƠI</b><input id="code" class="input" placeholder="Ví dụ: PHUC01"><button id="join" class="btn">KIỂM TRA LƯỢT</button>
<div id="stats" class="stats" style="display:none"><div class="stat"><b id="total">0</b><span>TỔNG LƯỢT</span></div><div class="stat"><b id="used">0</b><span>ĐÃ QUAY</span></div><div class="stat"><b id="remaining">0</b><span>CÒN LẠI</span></div></div>
<div id="status" class="status"></div><button id="spin" class="btn" disabled>QUAY NGAY</button><div id="result" class="result"></div>
<div class="history"><h3>📋 Danh sách kết quả</h3><div id="historyList" class="history-list"><div class="history-empty">Chưa có lượt quay nào.</div></div></div>
<p class="hint">Mỗi lần quay sẽ tự trừ 1 lượt. Danh sách kết quả được lưu theo mã người chơi.</p></div></div></div>
<script>
const prizes=[['Bao cơm trưa',.5],['Cà phê',.5],['10.000 VND',15],['20.000 VND',8],['50.000 VND',10],['100.000 VND',4],['200.000 VND',2],['Trúng Gió',60]];
const colors=['#ef4444','#f59e0b','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899'];let angle=0,busy=false,turns=0,currentCode='';
const c=document.getElementById('c'),x=c.getContext('2d');
function draw(){x.clearRect(0,0,700,700);let n=prizes.length,a=2*Math.PI/n;x.save();x.translate(350,350);x.rotate(angle);prizes.forEach((p,i)=>{let q=i*a;x.beginPath();x.moveTo(0,0);x.arc(0,0,320,q,q+a);x.closePath();x.fillStyle=colors[i];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.save();x.rotate(q+a/2);x.textAlign='right';x.fillStyle='#fff';x.font='bold 19px Arial';x.fillText(p[0],295,7);x.restore()});x.restore();x.beginPath();x.arc(350,350,52,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.fillStyle='#111827';x.font='bold 17px Arial';x.textAlign='center';x.fillText('QUAY',350,356)}
async function post(p,d){let r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});return [r.ok,await r.json()]}
function renderStats(d){document.getElementById('stats').style.display='grid';document.getElementById('total').textContent=d.total??0;document.getElementById('used').textContent=d.used??0;document.getElementById('remaining').textContent=d.turns??0;turns=d.turns??0;spin.disabled=turns<=0||busy}
function renderHistory(list){if(!list||!list.length){historyList.innerHTML='<div class="history-empty">Chưa có lượt quay nào.</div>';return}historyList.innerHTML=list.map((h,i)=>`<div class="history-item"><span><b>Lượt ${list.length-i}</b> · <span class="prize">${h.prize}</span></span><span>${new Date(h.time).toLocaleString('vi-VN')}</span></div>`).join('')}
join.onclick=async()=>{let code=document.getElementById('code').value.trim().toUpperCase();if(!code)return;currentCode=code;let [ok,d]=await post('/api/player',{code});if(ok){renderStats(d);status.textContent=turns>0?'Bạn còn '+turns+' lượt quay':'Bạn đã hết lượt quay';result.textContent='';renderHistory(d.history)}else status.textContent=d.error||'Lỗi'};
spin.onclick=async()=>{if(busy||turns<=0||!currentCode)return;let [ok,d]=await post('/api/spin',{code:currentCode});if(!ok){status.textContent=d.error;return}turns=d.turns;busy=true;spin.disabled=true;result.textContent='';let wi=prizes.findIndex(p=>p[0]===d.prize),a=2*Math.PI/prizes.length,target=-Math.PI/2-(wi*a+a/2),cur=((angle%(2*Math.PI))+2*Math.PI)%(2*Math.PI),delta=((target-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*6,start=angle,t0=performance.now(),dur=5200;function anim(t){let p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);angle=start+delta*e;draw();if(p<1)requestAnimationFrame(anim);else{busy=false;result.textContent='🏆 '+d.prize;renderStats(d);status.textContent=turns>0?'Bạn còn '+turns+' lượt quay':'Bạn đã hết lượt quay';loadHistory()}}requestAnimationFrame(anim)};
async function loadHistory(){if(!currentCode)return;let [ok,d]=await post('/api/player',{code:currentCode});if(ok){renderStats(d);renderHistory(d.history)}}
draw();
</script></body></html>
